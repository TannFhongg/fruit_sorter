alerts:
  low_confidence_streak: 5
  queue_overflow_warn: 15
  serial_reconnect_max: 5
arduino:
  heartbeat:
    interval_s: 5
    max_missed: 3
  serial:
    baudrate: 115200
    port: /dev/ttyUSB0
    reconnect_delay_s: 3.0
    reconnect_max: 10
    timeout_s: 1.0
camera:
  buffer_size: 2
  device_index: 0
  fps: 30
  height: 480
  width: 640
conveyor:
  camera_to_ir1_m: 0.25
  camera_to_ir2_m: 0.45
  image_flow_axis: x
  image_flow_direction: left_to_right
  speed_m_s: 0.3
  timing:
    ir1_window_ms:
    - 1386
    - 3108
    ir2_window_ms:
    - 4392
    - 7551
    tolerance_pct: 20
dashboard:
  max_log_entries: 200
  push_interval_s: 1.0
database:
  cache_kb: 4096
  path: data/sorter.db
  retention:
    events_days: 30
    stats_days: 365
  wal_mode: true
  write_queue:
    flush_batch_size: 20
    flush_interval_s: 5
hardware:
  ir_sensors:
    ir1:
      debounce_ms: 20
      label: station_green
      pin: 2
    ir2:
      debounce_ms: 20
      label: station_yellow
      pin: 3
  servos:
    servo1:
      angle_home: 220
      angle_max: 270
      angle_sweep: 120
      label: flap_green
      pin: 9
      pulse_max_us: 2500
      pulse_min_us: 500
      return_duration_ms: 200
      sweep_duration_ms: 200
    servo2:
      angle_home: 0
      angle_max: 270
      angle_sweep: 100
      label: flap_yellow
      pin: 10
      pulse_max_us: 2500
      pulse_min_us: 500
      return_duration_ms: 200
      sweep_duration_ms: 200
model:
  frame_skip: 3
  input_size:
  - 320
  - 320
  label_colors:
    GREEN:
    - 0
    - 200
    - 50
    RED:
    - 0
    - 50
    - 220
    YELLOW:
    - 0
    - 210
    - 255
  labels:
    0: GREEN
    1: RED
    2: YELLOW
  num_threads: 4
  path: models/best_ncnn_model
  routing:
    GREEN:
      direction: fire
      servo: 1
    RED:
      direction: pass
      servo: null
    UNKNOWN:
      direction: pass
      servo: null
    YELLOW:
      direction: fire
      servo: 2
  thresholds:
    confidence: 0.5
    iou_nms: 0.45
    min_bbox_area: 1500
  tracking:
    center_distance_px: 76
    iou_threshold: 0.35
    ttl_ms: 600
  type: ncnn
  use_gpu: false
system:
  log_file: logs/sorter.log
  log_level: INFO
  mode: production
  name: FruitSorter v3.0
  queue_maxlen: 20
  timezone: Asia/Ho_Chi_Minh
web:
  cors_allowed_origins: '*'
  host: 0.0.0.0
  port: 5000
  secret_key: fruit-sorter-secret-2025
  socketio_async_mode: threading
